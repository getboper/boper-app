<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#f8fafc" />
  
  <!-- Header -->
  <rect width="800" height="60" fill="#ffffff" />
  <rect x="20" y="20" width="120" height="20" rx="4" fill="#5461F9" />
  <rect x="660" y="15" width="30" height="30" rx="15" fill="#5461F9" opacity="0.2" />
  <rect x="700" y="15" width="30" height="30" rx="15" fill="#5461F9" opacity="0.2" />
  <rect x="740" y="15" width="30" height="30" rx="15" fill="#5461F9" opacity="0.2" />
  
  <!-- Sidebar -->
  <rect width="200" height="440" y="60" fill="#ffffff" />
  <rect x="20" y="90" width="160" height="12" rx="2" fill="#5461F9" opacity="0.2" />
  <rect x="20" y="130" width="160" height="12" rx="2" fill="#5461F9" opacity="0.1" />
  <rect x="20" y="170" width="160" height="12" rx="2" fill="#5461F9" opacity="0.1" />
  <rect x="20" y="210" width="160" height="12" rx="2" fill="#5461F9" opacity="0.1" />
  <rect x="20" y="250" width="160" height="12" rx="2" fill="#5461F9" opacity="0.1" />
  
  <!-- Main Content Area -->
  <rect x="220" y="80" width="560" height="80" rx="8" fill="#ffffff" />
  <rect x="240" y="100" width="120" height="20" rx="4" fill="#5461F9" opacity="0.8" />
  <rect x="240" y="130" width="200" height="10" rx="2" fill="#5461F9" opacity="0.2" />
  
  <!-- Stats Cards -->
  <rect x="220" y="180" width="260" height="100" rx="8" fill="#ffffff" />
  <rect x="240" y="200" width="80" height="20" rx="4" fill="#5461F9" opacity="0.2" />
  <rect x="240" y="240" width="120" height="20" rx="4" fill="#5461F9" />
  
  <rect x="500" y="180" width="260" height="100" rx="8" fill="#ffffff" />
  <rect x="520" y="200" width="80" height="20" rx="4" fill="#5461F9" opacity="0.2" />
  <rect x="520" y="240" width="120" height="20" rx="4" fill="#5461F9" />
  
  <!-- Job Board -->
  <rect x="220" y="300" width="260" height="180" rx="8" fill="#ffffff" />
  <rect x="240" y="320" width="100" height="20" rx="4" fill="#5461F9" opacity="0.2" />
  <rect x="240" y="350" width="220" height="30" rx="4" fill="#5461F9" opacity="0.1" />
  <rect x="240" y="390" width="220" height="30" rx="4" fill="#5461F9" opacity="0.1" />
  <rect x="240" y="430" width="220" height="30" rx="4" fill="#5461F9" opacity="0.1" />
  
  <!-- Calendar/Upcoming -->
  <rect x="500" y="300" width="260" height="180" rx="8" fill="#ffffff" />
  <rect x="520" y="320" width="100" height="20" rx="4" fill="#5461F9" opacity="0.2" />
  <rect x="520" y="350" width="220" height="20" rx="4" fill="#5461F9" opacity="0.1" />
  <rect x="520" y="380" width="220" height="20" rx="4" fill="#5461F9" opacity="0.1" />
  <rect x="520" y="410" width="220" height="20" rx="4" fill="#5461F9" opacity="0.1" />
  <rect x="520" y="440" width="220" height="20" rx="4" fill="#5461F9" opacity="0.1" />
  
  <!-- Overlay with gradient -->
  <rect width="800" height="500" fill="url(#overlay)" opacity="0.05" />
  
  <defs>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
